<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Merge PDFs - PDF Extractor</title>


  <!-- PDF-LIB -->

  <script
    src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #111827;
    }


    /* =========================
       NAVBAR
    ========================= */

    .navbar {

      height: 70px;

      background: white;

      border-bottom:
        1px solid #e5e7eb;

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 0 7%;

    }


    .logo {

      text-decoration: none;

      color: #2563eb;

      font-size: 22px;

      font-weight: bold;

    }


    .nav-links {

      display: flex;

      gap: 25px;

      list-style: none;

    }


    .nav-links a {

      text-decoration: none;

      color: #374151;

    }


    .nav-links a:hover {

      color: #2563eb;

    }


    /* =========================
       MAIN
    ========================= */

    .container {

      max-width: 1000px;

      margin: auto;

      padding: 50px 20px;

    }


    .title {

      text-align: center;

      margin-bottom: 35px;

    }


    .title h1 {

      font-size: 40px;

      margin-bottom: 10px;

    }


    .title p {

      color: #6b7280;

    }


    /* =========================
       UPLOAD
    ========================= */

    .upload-box {

      background: white;

      border:
        2px dashed #93c5fd;

      border-radius: 15px;

      padding: 45px;

      text-align: center;

      margin-bottom: 25px;

    }


    .upload-icon {

      font-size: 45px;

      margin-bottom: 15px;

    }


    .upload-box h2 {

      margin-bottom: 10px;

    }


    .upload-box p {

      color: white;

      margin-bottom: 20px;

    }


    #pdfInput {

      display: none;

    }


    .upload-button {

      display: inline-block;

      background:red;

      color: white;

      padding: 13px 25px;

      border-radius: 8px;

      cursor: pointer;

      font-weight: bold;

    }


    .upload-button:hover {

      background: #1d4ed8;

    }


    /* =========================
       FILE LIST
    ========================= */

    .file-section {

      display: none;

      background: white;

      border:
        1px solid #e5e7eb;

      border-radius: 12px;

      padding: 25px;

    }


    .file-section h2 {

      font-size: 22px;

      margin-bottom: 15px;

    }


    .file-list {

      display: flex;

      flex-direction: column;

      gap: 10px;

    }


    .file-item {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      background: #f8fafc;

      border:
        1px solid #e5e7eb;

      border-radius: 9px;

      padding: 13px 15px;

    }


    .file-details {

      display: flex;

      align-items: center;

      gap: 12px;

      min-width: 0;

    }


    .file-icon {

      font-size: 25px;

    }


    .file-name {

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

    }


    .file-size {

      color: #6b7280;

      font-size: 13px;

      margin-top: 3px;

    }


    .remove-button {

      background: #fee2e2;

      color: #dc2626;

      padding: 8px 12px;

      flex-shrink: 0;

    }


    .remove-button:hover {

      background: #fecaca;

    }


    /* =========================
       ACTIONS
    ========================= */

    .actions {

      display: flex;

      justify-content: center;

      gap: 12px;

      flex-wrap: wrap;

      margin-top: 25px;

    }


    .merge-button {

      background: #16a34a;

      color: white;

      border: none;

      padding: 15px 35px;

      border-radius: 9px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    .merge-button:hover {

      background: #15803d;

    }


    .merge-button:disabled {

      background: #9ca3af;

      cursor: not-allowed;

    }


    .clear-button {

      background: #f3f4f6;

      color: #374151;

      border: none;

      padding: 15px 25px;

      border-radius: 9px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    .clear-button:hover {

      background: #e5e7eb;

    }


    /* =========================
       STATUS
    ========================= */

    #status {

      text-align: center;

      margin-top: 20px;

      font-weight: bold;

      line-height: 1.6;

    }


    .success {

      color: #16a34a;

    }


    .error {

      color: #dc2626;

    }


    .loading {

      color: #2563eb;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .navbar {

        padding: 0 20px;

      }


      .title h1 {

        font-size: 32px;

      }


      .upload-box {

        padding: 30px 15px;

      }


      .file-item {

        align-items: flex-start;

      }


      .file-name {

        max-width: 180px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       NAVBAR
  ========================= -->

  <header class="navbar">

    <a
      href="index.html"
      class="logo"
    >
      PDF Extractor
    </a>


    <nav>

      <ul class="nav-links">

        <li>

          <a href="index.html">
            Home
          </a>

        </li>


        <li>

          <a href="index.html#tools">
            Tools
          </a>

        </li>

      </ul>

    </nav>

  </header>



  <!-- =========================
       MAIN
  ========================= -->

  <main class="container">


    <section class="title">

      <h1>
        Merge PDFs
      </h1>


      <p>
        Combine multiple PDF files
        into one PDF.
      </p>

    </section>



    <!-- =========================
         UPLOAD
    ========================= -->

    <section class="upload-box">

      <div class="upload-icon">
        🔗
      </div>


      <h2>
        Select PDF files
      </h2>


      <p>
        You can select multiple PDF files.
      </p>


      <input
        type="file"
        id="pdfInput"
        accept=".pdf,application/pdf"
        multiple
      >


      <label
        for="pdfInput"
        class="upload-button"
      >
        Choose PDFs
      </label>

    </section>



    <!-- =========================
         FILE LIST
    ========================= -->

    <section
      class="file-section"
      id="fileSection"
    >

      <h2>
        Selected PDFs
      </h2>


      <div
        class="file-list"
        id="fileList"
      ></div>


      <div class="actions">

        <button
          class="merge-button"
          id="mergeButton"
        >
          Merge PDFs
        </button>


        <button
          class="clear-button"
          id="clearButton"
        >
          Clear All
        </button>

      </div>


      <div id="status"></div>

    </section>


  </main>



  <script>


    /*
      =========================
      CHECK PDF-LIB
      =========================
    */

    if (
      typeof PDFLib === "undefined"
    ) {

      alert(
        "PDF-LIB could not load. Please check your internet connection and refresh the page."
      );

      throw new Error(
        "PDF-LIB library not loaded."
      );

    }


    /*
      =========================
      ELEMENTS
      =========================
    */

    const pdfInput =
      document.getElementById(
        "pdfInput"
      );


    const fileSection =
      document.getElementById(
        "fileSection"
      );


    const fileList =
      document.getElementById(
        "fileList"
      );


    const mergeButton =
      document.getElementById(
        "mergeButton"
      );


    const clearButton =
      document.getElementById(
        "clearButton"
      );


    const status =
      document.getElementById(
        "status"
      );


    /*
      =========================
      FILE ARRAY
      =========================
    */

    let selectedFiles = [];


    /*
      =========================
      SELECT FILES
      =========================
    */

    pdfInput.addEventListener(
      "change",
      function () {


        const files =
          Array.from(
            this.files
          );


        /*
          Check files
        */

        for (
          const file of files
        ) {

          if (
            file.type !==
              "application/pdf" &&
            !file.name
              .toLowerCase()
              .endsWith(".pdf")
          ) {

            showError(
              `${file.name} is not a PDF file.`
            );

            continue;

          }


          /*
            Avoid duplicate file
          */

          const alreadyExists =
            selectedFiles.some(
              existingFile =>
                existingFile.name ===
                  file.name &&
                existingFile.size ===
                  file.size &&
                existingFile.lastModified ===
                  file.lastModified
            );


          if (
            !alreadyExists
          ) {

            selectedFiles.push(
              file
            );

          }

        }


        /*
          Reset input so the
          same file can be selected
          again later
        */

        this.value = "";


        renderFiles();

      }
    );


    /*
      =========================
      DISPLAY FILES
      =========================
    */

    function renderFiles() {


      fileList.innerHTML = "";


      if (
        selectedFiles.length === 0
      ) {

        fileSection.style.display =
          "none";

        return;

      }


      fileSection.style.display =
        "block";


      selectedFiles.forEach(
        (file, index) => {


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "file-item";


          /*
            File details
          */

          const details =
            document.createElement(
              "div"
            );


          details.className =
            "file-details";


          /*
            Icon
          */

          const icon =
            document.createElement(
              "div"
            );


          icon.className =
            "file-icon";


          icon.textContent =
            "📄";


          /*
            Text container
          */

          const text =
            document.createElement(
              "div"
            );


          /*
            File name
          */

          const name =
            document.createElement(
              "div"
            );


          name.className =
            "file-name";


          name.textContent =
            `${index + 1}. ${file.name}`;


          /*
            File size
          */

          const size =
            document.createElement(
              "div"
            );


          size.className =
            "file-size";


          size.textContent =
            formatFileSize(
              file.size
            );


          text.appendChild(
            name
          );


          text.appendChild(
            size
          );


          details.appendChild(
            icon
          );


          details.appendChild(
            text
          );


          /*
            Remove button
          */

          const remove =
            document.createElement(
              "button"
            );


          remove.className =
            "remove-button";


          remove.textContent =
            "Remove";


          remove.addEventListener(
            "click",
            function () {

              selectedFiles.splice(
                index,
                1
              );


              renderFiles();

            }
          );


          item.appendChild(
            details
          );


          item.appendChild(
            remove
          );


          fileList.appendChild(
            item
          );

        }
      );


      clearStatus();

    }



    /*
      =========================
      CLEAR ALL
      =========================
    */

    clearButton.addEventListener(
      "click",
      function () {

        selectedFiles = [];

        renderFiles();

        clearStatus();

      }
    );



    /*
      =========================
      MERGE PDFs
      =========================
    */

    mergeButton.addEventListener(
      "click",
      async function () {


        /*
          Need at least
          two PDFs
        */

        if (
          selectedFiles.length < 2
        ) {

          showError(
            "Please select at least two PDF files."
          );

          return;

        }


        try {


          mergeButton.disabled =
            true;


          showLoading(
            "Starting PDF merge..."
          );


          /*
            Create new PDF
          */

          const mergedPdf =
            await PDFLib
              .PDFDocument
              .create();


          /*
            Process files
            one by one
          */

          for (
            let i = 0;
            i < selectedFiles.length;
            i++
          ) {


            const file =
              selectedFiles[i];


            showLoading(
              `Merging PDF ${i + 1} of ${selectedFiles.length}...`
            );


            /*
              Read file
            */

            const bytes =
              await file.arrayBuffer();


            /*
              Load source PDF
            */

            const sourcePdf =
              await PDFLib
                .PDFDocument
                .load(
                  bytes
                );


            /*
              Get all pages
            */

            const pageIndexes =
              sourcePdf
                .getPageIndices();


            /*
              Copy all pages
            */

            const copiedPages =
              await mergedPdf
                .copyPages(
                  sourcePdf,
                  pageIndexes
                );


            /*
              Add pages
            */

            copiedPages.forEach(
              page => {

                mergedPdf.addPage(
                  page
                );

              }
            );

          }


          /*
            Save merged PDF
          */

          showLoading(
            "Creating final PDF..."
          );


          const mergedBytes =
            await mergedPdf.save();


          /*
            Create download
          */

          const blob =
            new Blob(
              [mergedBytes],
              {
                type:
                  "application/pdf"
              }
            );


          const url =
            URL.createObjectURL(
              blob
            );


          const link =
            document.createElement(
              "a"
            );


          link.href =
            url;


          link.download =
            "merged.pdf";


          document.body.appendChild(
            link
          );


          link.click();


          link.remove();


          /*
            Clean URL
          */

          setTimeout(
            function () {

              URL.revokeObjectURL(
                url
              );

            },
            1000
          );


          showSuccess(
            "✓ PDFs merged successfully! Your merged PDF has been downloaded."
          );


        } catch (error) {


          /*
            IMPORTANT:
            Show real error
            in browser console
          */

          console.error(
            "Merge error:",
            error
          );


          showError(
            "Something went wrong while merging the PDFs. Open F12 → Console to see the exact error."
          );

        }


        mergeButton.disabled =
          false;

      }
    );



    /*
      =========================
      FILE SIZE
      =========================
    */

    function formatFileSize(
      bytes
    ) {

      if (
        bytes === 0
      ) {

        return "0 Bytes";

      }


      const units =
        [
          "Bytes",
          "KB",
          "MB",
          "GB"
        ];


      const i =
        Math.floor(
          Math.log(bytes) /
          Math.log(1024)
        );


      return (
        parseFloat(
          (
            bytes /
            Math.pow(
              1024,
              i
            )
          ).toFixed(2)
        ) +
        " " +
        units[i]
      );

    }



    /*
      =========================
      STATUS
      =========================
    */

    function showLoading(
      message
    ) {

      status.textContent =
        message;

      status.className =
        "loading";

    }


    function showSuccess(
      message
    ) {

      status.textContent =
        message;

      status.className =
        "success";

    }


    function showError(
      message
    ) {

      status.textContent =
        "✕ " + message;

      status.className =
        "error";

    }


    function clearStatus() {

      status.textContent =
        "";

      status.className =
        "";

    }

  </script>


</body>

</html>
